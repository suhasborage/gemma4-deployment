# Gemma 4 E4B - Local AI Model via Ollama
# Optimized for Apple Silicon (M1/M2/M3/M4)
# Exposes OpenAI-compatible API on http://localhost:11434

services:
  ollama:
    image: ollama/ollama:latest
    container_name: gemma4-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_FLASH_ATTENTION=false
      - OLLAMA_LLM_LIBRARY=cpu
    # Apple Silicon uses CPU in Docker (no GPU passthrough)
    # Flash attention disabled — crashes on ARM64 CPU in Docker
    # OLLAMA_LLM_LIBRARY=cpu forces the stable CPU backend
    shm_size: '4g'
    # No memory limit — let the VM manage allocation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # OpenAI-compatible proxy (optional - Ollama already supports /v1/ endpoints)
  # Useful if you need strict OpenAI API compatibility
  openai-proxy:
    image: ghcr.io/open-webui/open-webui:main
    container_name: gemma4-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
      - ENABLE_SIGNUP=false
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - webui_data:/app/backend/data
    restart: unless-stopped
    profiles:
      - webui  # Only starts with: docker compose --profile webui up

volumes:
  ollama_data:
    driver: local
  webui_data:
    driver: local
