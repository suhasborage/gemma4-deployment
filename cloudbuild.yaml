# ─────────────────────────────────────────────────────────────
# cloudbuild.yaml — Build & deploy Gemma 4 E4B to GCE VM
#
# NOT Cloud Run — Ollama needs persistent storage + long startup.
# This deploys to a dedicated GCE VM instead.
#
# Prerequisites (run once):
#   ./scripts/gcp-setup.sh
#
# Manual trigger:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --project=$PROJECT_ID .
# ─────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _ZONE: us-central1-a
  _VM_NAME: gemma4-vm
  _MACHINE_TYPE: e2-standard-8
  _ARTIFACT_REPO: gemma4-repo
  _IMAGE_NAME: gemma4-unified

steps:
  # ─── Step 0: Build the unified Docker image ────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # ─── Step 1: Push to Artifact Registry ─────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}'

  # ─── Step 2: Create or update GCE VM ───────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest"

        echo "=== Gemma 4 GCE Deployment ==="
        echo "Image: $${IMAGE}"
        echo "VM:    ${_VM_NAME} (${_ZONE})"

        # ── Check if VM exists ──
        if gcloud compute instances describe ${_VM_NAME} \
            --zone=${_ZONE} --format="value(name)" 2>/dev/null; then

          echo ""
          echo ">>> VM exists — updating container..."

          # Ensure VM is running
          STATUS=$$(gcloud compute instances describe ${_VM_NAME} \
              --zone=${_ZONE} --format="value(status)")
          if [ "$$STATUS" != "RUNNING" ]; then
            echo "    VM is $$STATUS — starting it..."
            gcloud compute instances start ${_VM_NAME} --zone=${_ZONE}
            sleep 30
          fi

          # SSH in and update container
          gcloud compute ssh ${_VM_NAME} \
            --zone=${_ZONE} \
            --tunnel-through-iap \
            --command="
              set -e
              echo 'Configuring Artifact Registry auth...'
              sudo gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet 2>/dev/null || true

              echo 'Pulling latest image...'
              sudo docker pull $${IMAGE}

              echo 'Stopping old container...'
              sudo docker stop gemma4-unified 2>/dev/null || true
              sudo docker rm gemma4-unified 2>/dev/null || true

              echo 'Starting new container...'
              sudo docker run -d \
                --name gemma4-unified \
                --restart unless-stopped \
                --shm-size=4g \
                -p 11434:11434 \
                -p 3001:3001 \
                -v ollama_data:/root/.ollama \
                -e OLLAMA_FLASH_ATTENTION=true \
                -e OLLAMA_CONTEXT_LENGTH=8192 \
                -e OLLAMA_LLM_LIBRARY=cpu \
                $${IMAGE}

              echo 'Waiting for services...'
              for i in \$$(seq 1 120); do
                if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 && \
                   curl -sf http://localhost:3001/health >/dev/null 2>&1; then
                  echo \"Services ready after \$${i}s\"
                  curl -sf http://localhost:3001/health
                  break
                fi
                [ \$$((i % 15)) -eq 0 ] && echo \"  Still starting... (\$${i}s)\"
                [ \$$i -eq 120 ] && echo 'Warning: services not ready after 120s'
                sleep 1
              done

              echo ''
              sudo docker ps --filter name=gemma4-unified --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            "

        else
          echo ""
          echo ">>> VM does not exist — creating ${_VM_NAME}..."

          # Create VM with Docker pre-installed via startup script
          gcloud compute instances create ${_VM_NAME} \
            --zone=${_ZONE} \
            --machine-type=${_MACHINE_TYPE} \
            --boot-disk-size=50GB \
            --boot-disk-type=pd-ssd \
            --image-family=ubuntu-2204-lts \
            --image-project=ubuntu-os-cloud \
            --no-address \
            --tags=gemma4-iap \
            --scopes=default,storage-ro \
            --metadata=startup-script='#!/bin/bash
              exec > /var/log/gemma4-startup.log 2>&1
              set -e
              # Install Docker
              curl -fsSL https://get.docker.com | sh
              apt-get install -y -qq docker-compose-plugin
              systemctl enable docker && systemctl start docker
              # Auth to Artifact Registry
              gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet
              # Pull and run
              docker pull '"$${IMAGE}"'
              docker run -d \
                --name gemma4-unified \
                --restart unless-stopped \
                --shm-size=4g \
                -p 11434:11434 \
                -p 3001:3001 \
                -v ollama_data:/root/.ollama \
                -e OLLAMA_FLASH_ATTENTION=true \
                -e OLLAMA_CONTEXT_LENGTH=8192 \
                -e OLLAMA_LLM_LIBRARY=cpu \
                '"$${IMAGE}"'
              echo "Gemma 4 container started"
            '

          echo "VM created. First boot installs Docker + pulls image (~3-5 min)."
          echo "Connect via: gcloud compute ssh ${_VM_NAME} --zone=${_ZONE} --tunnel-through-iap"
        fi

        echo ""
        echo "=== Deployment complete ==="
        echo "Connect: ./scripts/gcp-deploy.sh --connect"
        echo "  Then: http://localhost:11434 (Ollama)"
        echo "  Then: http://localhost:3001/sse (MCP)"

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
