# ─────────────────────────────────────────────────────────────
# cloudbuild.yaml — Build & push Gemma 4 E4B unified image
#
# Trigger setup in Cloud Build:
#   Source:           Your Git repo
#   Build config:     /cloudbuild.yaml (this file)
#   Included files:   Dockerfile, mcp-server/**, scripts/**
#
# Manual run:
#   gcloud builds submit --config=cloudbuild.yaml .
#
# What it does:
#   1. Builds the unified Docker image (Ollama + MCP server)
#   2. Pushes to Artifact Registry
#   3. Deploys to GCE VM via container-optimized OS
# ─────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _ZONE: us-central1-a
  _VM_NAME: gemma4-vm
  _MACHINE_TYPE: e2-standard-8
  _ARTIFACT_REPO: gemma4-repo
  _IMAGE_NAME: gemma4-unified

steps:
  # ─── Step 0: Build the unified Docker image ────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # ─── Step 1: Push to Artifact Registry ─────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}'

  # ─── Step 2: Deploy to GCE VM ─────────────────────────────
  # Updates the running container on the VM
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Check if VM exists
        if gcloud compute instances describe ${_VM_NAME} \
            --zone=${_ZONE} --format="value(name)" 2>/dev/null; then
          echo "VM exists — updating container..."
          gcloud compute ssh ${_VM_NAME} \
            --zone=${_ZONE} \
            --tunnel-through-iap \
            --command="
              sudo docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest
              sudo docker stop gemma4-unified 2>/dev/null || true
              sudo docker rm gemma4-unified 2>/dev/null || true
              sudo docker run -d \
                --name gemma4-unified \
                --restart unless-stopped \
                --shm-size=4g \
                -p 11434:11434 \
                -p 3001:3001 \
                -v ollama_data:/root/.ollama \
                -e OLLAMA_FLASH_ATTENTION=true \
                -e OLLAMA_CONTEXT_LENGTH=8192 \
                ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest
              echo 'Container updated and running'
            "
        else
          echo "VM does not exist — create it first with gcp-deploy.sh"
          echo "Or create manually:"
          echo "  gcloud compute instances create ${_VM_NAME} \\"
          echo "    --zone=${_ZONE} --machine-type=${_MACHINE_TYPE} \\"
          echo "    --boot-disk-size=50GB --image-family=ubuntu-2204-lts \\"
          echo "    --image-project=ubuntu-os-cloud --no-address --tags=gemma4-iap"
        fi

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
